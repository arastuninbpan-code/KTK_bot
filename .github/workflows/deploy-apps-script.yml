# Автоматическая публикация бота в Google Apps Script: при каждом изменении кода на main (после тестов)
# отправляет Code.gs в проект и обновляет развёртывание (адрес /exec не меняется).
# Нужен секрет CLASPRC_JSON (доступ clasp к вашему аккаунту Google). Запуск вручную: Actions → эта задача → Run workflow.
name: Публикация в Apps Script

on:
  push:
    branches: [main]
    paths:
      - "apps_script_bot/**"
      - "app/lib/**"
      - "app/gas/**"
      - ".github/workflows/deploy-apps-script.yml"
  workflow_dispatch:

concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  SCRIPT_ID: 1-bAbXwl8Y15wcJ8HSg55rWxKmipOcqnWMC97zyex2f7MkHpgU5wd-_qq
  DEPLOYMENT_ID: AKfycbzVhNa1N9hEyE9h4OdtebikEofHTdASFK45WCPGPBsaXUC_YfVBRcZ_W4Cv9pdUk9vsXg

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Тесты и проверка, что Code.gs собран из исходников
        run: |
          cd app
          node --test test/*.test.mjs
          node build-gas.mjs --check
      - name: Доступ к Google (секрет CLASPRC_JSON)
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "::error::Не задан секрет CLASPRC_JSON (Settings → Secrets and variables → Actions)"; exit 1; fi
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Какие разрешения выданы ключу (печатается только список разрешений, не сам ключ)
        run: |
          node -e '
            (async () => {
              const j = JSON.parse(require("fs").readFileSync(process.env.HOME + "/.clasprc.json", "utf8"));
              let cred = null;
              (function walk(o) { for (const v of Object.values(o || {})) { if (v && typeof v === "object") { if (v.refresh_token) cred = cred || v; else walk(v); } } })(j);
              if (!cred) { console.log("::error::В секрете нет refresh_token: вставлен не весь файл .clasprc.json"); return; }
              const r = await fetch("https://oauth2.googleapis.com/token", {method: "POST", headers: {"Content-Type": "application/x-www-form-urlencoded"},
                body: new URLSearchParams({client_id: cred.client_id, client_secret: cred.client_secret, refresh_token: cred.refresh_token, grant_type: "refresh_token"})});
              const t = await r.json();
              if (!t.access_token) { console.log("::error::Google не принял ключ: " + (t.error_description || t.error)); return; }
              const info = await (await fetch("https://oauth2.googleapis.com/tokeninfo?access_token=" + encodeURIComponent(t.access_token))).json();
              const have = String(info.scope || "").split(/\s+/).filter(Boolean);
              console.log("Аккаунт:", info.email || "(не показан)");
              console.log("Выдано разрешений:", have.length);
              have.sort().forEach((x) => console.log(" -", x.replace("https://www.googleapis.com/auth/", "")));
              for (const n of ["script.projects", "script.deployments", "script.webapp.deploy"]) if (!have.some((x) => x.endsWith("/" + n))) console.log("::warning::НЕ ХВАТАЕТ разрешения " + n);
            })().catch((e) => console.log("::error::" + e.message));
          '
      - name: Отправить код и обновить развёртывание
        run: |
          npm install -g @google/clasp@3.4.1
          cd apps_script_bot
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > .clasp.json
          clasp push --force
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "авто ${GITHUB_SHA::7}"
